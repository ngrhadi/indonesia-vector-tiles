<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Maps PMTiles + Openlayers</title>
    <script src="https://cdn.jsdelivr.net/npm/ol@v9.0.0/dist/ol.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v9.0.0/ol.css">
    <script src="https://unpkg.com/ol-pmtiles@2.0.2/dist/olpmtiles.js"></script>

    <style>
       body, #map {
            height:100vh;
            margin: 0;
        }
    </style>
  </head>
  <body>
    <div id="map" class="map"></div>

     <script type="text/javascript">
          const vectorLayer = new ol.layer.VectorTile({
            declutter: true,
            source: new olpmtiles.PMTilesVectorSource({
              url: "http://localhost:3000/11.pmtiles",
              attributions: ["© Administrasi Provinsi Aceh"]
            }),
            style: new ol.style.Style({
              stroke: new ol.style.Stroke({
                color: 'gray',
                width: 1,
              }),
              fill: new ol.style.Fill({
                color: 'rgba(20,20,20,0.9)',
              })
            })
          });

          ol.proj.useGeographic();
          const map = new ol.Map({
            layers: [vectorLayer],
            target: 'map',
            view: new ol.View({
              center: [96.8, 4.3],
              zoom: 7
            }),
          });
        </script>
  </body>
</html>
